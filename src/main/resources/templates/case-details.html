<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Investigation Workspace</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{

background:#eef2f7;

}

.card{

border:none;

border-radius:15px;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<span class="navbar-brand">

<i class="bi bi-shield-lock-fill"></i>

ForensiChain Investigation Workspace

</span>

</div>

</nav>

<div class="container mt-4">

<div class="row">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h4 th:text="${case.caseNumber}"></h4>

<hr>

<p>

<b>Title :</b>

<span th:text="${case.title}"></span>

</p>

<p>

<b>Type :</b>

<span th:text="${case.caseType}"></span>

</p>

<p>

<b>Priority :</b>

<span class="badge bg-danger"
th:text="${case.priority}"></span>

</p>

<p>

<b>Status :</b>

<span class="badge bg-success"
th:text="${case.status}"></span>

</p>

<p>

<b>Officer :</b>

<span th:text="${case.assignedOfficer}"></span>

</p>

<p>

<b>Created :</b>

<span th:text="${case.createdAt}"></span>

</p>

</div>

</div>

</div>

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>

Evidence in this Case

</h4>

</div>

<div class="card-body">

<h5>

Total Evidence :

<span th:text="${totalEvidence}"></span>

</h5>

<table class="table table-hover">

<thead>

<tr>

<th>ID</th>

<th>File</th>

<th>Owner</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="e : ${evidenceList}">

<td th:text="${e.id}"></td>

<td th:text="${e.fileName}"></td>

<td th:text="${e.userId}"></td>

<td>

<a
class="btn btn-primary btn-sm"
th:href="@{/evidence/{id}(id=${e.id})}">

View

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<br>

<a
href="/cases"
class="btn btn-secondary">

⬅ Back to Cases

</a>

</div>

</body>

</html>
