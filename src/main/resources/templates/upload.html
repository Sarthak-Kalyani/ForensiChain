<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Evidence | ForensiChain</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #eef2f7;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #111827, #1e3a8a) !important;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn {
            border-radius: 8px;
        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark shadow">

    <div class="container">

        <a
            href="/dashboard"
            class="navbar-brand text-white text-decoration-none">

            <i class="bi bi-shield-lock-fill me-2"></i>

            <b>ForensiChain</b>

        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">

                <i class="bi bi-upload me-2"></i>

                Upload Digital Evidence

            </h3>

        </div>


        <div class="card-body p-4">

            <form
                action="/evidence/upload"
                method="post"
                enctype="multipart/form-data">


                <!-- USER ID -->

                <div class="mb-3">

                    <label class="form-label">
                        User ID
                    </label>

                    <input
                        class="form-control"
                        type="number"
                        name="userId"
                        min="1"
                        required>

                    <div class="form-text">
                        Enter the ID of the user uploading this evidence.
                    </div>

                </div>


                <!-- INVESTIGATION CASE -->

                <div class="mb-3">

                    <label class="form-label">

                        Investigation Case

                    </label>

                    <select
                        class="form-select"
                        name="caseId"
                        required>

                        <option value="">
                            Select Case
                        </option>

                        <option
                            th:each="c : ${cases}"
                            th:value="${c.id}"
                            th:text="${c.caseNumber + ' - ' + c.title}">
                        </option>

                    </select>

                    <div class="form-text">
                        Select the investigation case associated with this evidence.
                    </div>

                </div>


                <!-- FILE -->

                <div class="mb-4">

                    <label class="form-label">

                        Choose Evidence

                    </label>

                    <input
                        class="form-control"
                        type="file"
                        name="file"
                        required>

                    <div class="form-text">
                        Upload the original evidence file.
                    </div>

                </div>


                <!-- UPLOAD -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-success btn-lg">

                        <i class="bi bi-cloud-upload me-2"></i>

                        Upload Evidence

                    </button>

                </div>

            </form>


            <hr class="my-4">


            <!-- NAVIGATION -->

            <div class="text-center">

                <a
                    href="/dashboard"
                    class="btn btn-primary me-2">

                    <i class="bi bi-speedometer2 me-1"></i>

                    Dashboard

                </a>


                <a
                    href="/verifyPage"
                    class="btn btn-warning">

                    <i class="bi bi-shield-check me-1"></i>

                    Verify Evidence

                </a>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
